# Telegraf for the youless-tig stack (docker-compose.stack.yml).
#
# youless-tig sends its readings here in InfluxDB line protocol, with their own
# timestamps; Telegraf buffers them and writes them to InfluxDB. If InfluxDB is
# down, Telegraf keeps up to metric_buffer_limit points and retries.
#
# Tokens come from the "secrets" volume, created by influxdb/init on the first
# start (/run/secrets/<name> in this container). Organisation and bucket come
# from .env through the environment.

[agent]
  interval = "10s"
  flush_interval = "10s"
  # A first start reads the whole history of the YouLess at once (a few
  # thousand points per log): keep the batch large and the buffer larger.
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  omit_hostname = true
  skip_processors_after_aggregators = true

[[secretstores.docker]]
  id = "secrets"

# youless-tig → Telegraf (InfluxDB v2 write API, only on the stack's network).
[[inputs.influxdb_v2_listener]]
  service_address = ":8186"
  token = "@{secrets:telegraf_listener_token}"
  max_body_size = "32MiB"

# Telegraf → InfluxDB, with a token that may only write to the bucket.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "@{secrets:telegraf_token}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# Want more in the same InfluxDB (host CPU, memory, disks, Docker)? Add inputs
# here, e.g.:
# [[inputs.cpu]]
# [[inputs.mem]]
# [[inputs.disk]]
#   ignore_fs = ["tmpfs", "devtmpfs", "overlay"]
