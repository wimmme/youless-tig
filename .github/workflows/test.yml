name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # gofmt, go vet, go test -race, the images, the compose files, release notes.
      - name: Checks
        run: sh tools/verify.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The complete stack against the simulated YouLess (no real device).
      - name: Integration test
        run: sh tools/integration.sh
